<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Journal</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1c1a; --mute:#77736b; --line:#e4e0d7; --up:#1f7a4d; --down:#b3361f; --accent:#c98a12; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1e1d1b; --ink:#ece9e2; --mute:#9a958b; --line:#2e2c29; --up:#4cc38a; --down:#f07a5f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font:600 26px/1.2 Georgia, serif; margin:0 0 4px; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:32px 0 10px; }
  .mute { color:var(--mute); }
  label.drop { display:block; border:1.5px dashed var(--line); border-radius:10px; padding:18px; margin:18px 0; cursor:pointer; background:var(--card); }
  label.drop input { display:none; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  ul.flags { list-style:none; padding:0; margin:0; }
  ul.flags li { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--mute); font-weight:500; }
  td.n { text-align:right; }
  svg { width:100%; height:140px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
</style>
</head>
<body>
<main>
  <h1>Trade Journal</h1>
  <div class="mute">P&amp;L after estimated charges (brokerage, STT, exchange, GST, stamp, DP). Zerodha: Console → Reports → Tradebook → download CSV.</div>
  <label class="drop">Import tradebook CSV files (re-importing the same file is safe) <input type="file" accept=".csv" multiple id="file"></label>
  <div id="status" class="mute"></div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const inr = n => (n < 0 ? '−₹' : '₹') + Math.abs(Math.round(n)).toLocaleString('en-IN');
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const dt = ms => new Date(ms).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' });

$('#file').onchange = async e => {
  const msgs = [];
  for (const f of e.target.files) {
    const r = await (await fetch('/api/import', { method:'POST', body: await f.text() })).json();
    msgs.push(r.error ? `${f.name}: ${r.error}` : `${f.name}: ${r.added} new fills, ${r.duplicates} already imported, ${r.skipped} unreadable rows`);
  }
  $('#status').textContent = msgs.join(' · ');
  e.target.value = '';
  load();
};

function spark(eq) {
  if (eq.length < 2) return '';
  const lo = Math.min(0, ...eq), hi = Math.max(0, ...eq), span = hi - lo || 1;
  const pts = eq.map((v, i) => `${(i / (eq.length - 1)) * 1000},${130 - ((v - lo) / span) * 120}`).join(' ');
  const zero = 130 - ((0 - lo) / span) * 120;
  return `<svg viewBox="0 -5 1000 145" preserveAspectRatio="none">
    <line x1="0" x2="1000" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="2"/>
    <polyline points="${pts}" fill="none" stroke="var(--${eq.at(-1) >= 0 ? 'up' : 'down'})" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function table(title, m, sortByKey) {
  const rows = Object.entries(m).sort(sortByKey ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => a[1].pnl - b[1].pnl);
  return `<div><h2>${title}</h2><div class="scroll"><table><tr><th></th><th>Trades</th><th>Win %</th><th>P&amp;L</th></tr>${rows.map(([k, g]) =>
    `<tr><td>${esc(k)}</td><td class="n">${g.n}</td><td class="n">${Math.round(g.wins / g.n * 100)}</td><td class="n ${cls(g.pnl)}">${inr(g.pnl)}</td></tr>`).join('')}</table></div></div>`;
}

async function load() {
  const r = await (await fetch('/api/report')).json();
  if (r.error) return $('#out').textContent = r.error;
  if (!r.summary.n) return $('#out').innerHTML = `<p class="mute">No closed trades yet. ${r.fills} fills imported.</p>`;
  const s = r.summary;
  $('#out').innerHTML = `
    <div class="cards">
      <div class="card">Net P&amp;L<b class="${cls(s.pnl)}">${inr(s.pnl)}</b></div>
      <div class="card">Charges (est.)<b class="down">${inr(-s.charges)}</b></div>
      <div class="card">Trades<b>${s.n}</b></div>
      <div class="card">Win rate<b>${s.winRate}%</b></div>
      <div class="card">Avg win / loss<b><span class="up">${inr(s.avgWin)}</span> / <span class="down">${inr(s.avgLoss)}</span></b></div>
      <div class="card">Profit factor<b>${s.profitFactor == null ? '—' : s.profitFactor.toFixed(2)}</b></div>
      <div class="card">Max drawdown<b class="down">${inr(-s.maxDD)}</b></div>
    </div>
    <h2>Equity curve</h2>${spark(r.equity)}
    <h2>What the numbers say</h2><ul class="flags">${r.flags.map(f => `<li>${esc(f)}</li>`).join('') || '<li>Not enough trades for patterns yet.</li>'}</ul>
    <div class="grid3">${table('By entry hour', r.byHour, true)}${table('By weekday', r.byWeekday)}${table('By symbol (worst first)', r.bySymbol)}</div>
    ${r.open.length ? `<h2>Still open (${r.open.length}) — includes options that expired with no closing trade</h2><div class="scroll"><table><tr><th>Symbol</th><th>Qty</th><th>Price</th><th>Since</th></tr>${r.open.map(o =>
      `<tr><td>${esc(o.symbol)}</td><td class="n">${o.qty}</td><td class="n">${o.price}</td><td>${dt(o.time)}</td></tr>`).join('')}</table></div>` : ''}
    <h2>Recent round trips</h2><div class="scroll"><table><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Exit</th><th>Opened</th><th>Held</th><th>P&amp;L</th></tr>${r.trips.map(t =>
      `<tr><td>${esc(t.symbol)}</td><td>${t.side}</td><td class="n">${t.qty}</td><td class="n">${t.entry.toFixed(2)}</td><td class="n">${t.exit.toFixed(2)}</td><td>${dt(t.openedAt)}</td><td class="n">${Math.round((t.closedAt - t.openedAt) / 60e3)}m</td><td class="n ${cls(t.pnl)}">${inr(t.pnl)}</td></tr>`).join('')}</table></div>`;
}
load();
</script>
</body>
</html>
